services:
  # 1. Backend Web Service
  - type: web
    name: codreal-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDirectory: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  # 2. Cron Service for Syncing Ads
  - type: cron
    name: codreal-ads-sync
    env: python
    schedule: "0 */4 * * *" # Every 4 hours
    buildCommand: ""
    startCommand: "curl -X POST https://codreal-backend.onrender.com/api/v1/jobs/sync-ads -H \"Authorization: Bearer $CRON_SECRET\""
